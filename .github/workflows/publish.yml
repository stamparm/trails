# Publish the assembled trail set.
#
# ON A SCHEDULE, not on every commit. Content lands here around 40 times a day; assembling costs
# about three seconds, so compute is not the reason. Publishing per commit would mean 40 releases
# and ~3 GB of assets a day, and every deployed sensor seeing 40 changes it does not need. Four
# times a day, and only when the content actually changed, is 1,460 publishes a year instead of
# 14,600.
#
# The asset is GZIPPED. GitHub serves release assets as application/octet-stream straight from blob
# storage with no Content-Encoding - measured, not assumed - so nothing compresses them in transit
# and 81 MB goes on the wire as 81 MB. Every install pulling that once a day is the kind of number
# the acceptable-use policy calls "significantly excessive". 81 MB -> 11 MB, and the client checks
# the published sha256 (65 bytes) before downloading at all.
#
# trails.csv.sha256 is the hash of the UNCOMPRESSED csv, deliberately: it identifies the trail set
# rather than one particular compression of it, so change-detection here and integrity-checking in
# the client both stay meaningful even if the compressor changes.
#
# Every release carries assets named trails.csv.gz and trails.csv.sha256, so
# https://github.com/stamparm/trails/releases/latest/download/trails.csv.gz always resolves to the
# newest one - which is what STATIC_TRAILS_URL points at - while the dated tag stays available for
# a deployment that wants to pin.

name: Publish

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: assemble and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the content
        uses: actions/checkout@v5
        with:
          path: trails

      - name: Check out the engine (the assembler lives with the code it must agree with)
        uses: actions/checkout@v5
        with:
          repository: stamparm/maltrail
          path: maltrail

      - name: Assemble
        id: assemble
        working-directory: maltrail
        run: |
          python3 -m core.assemble --root ../trails \
            --out "$GITHUB_WORKSPACE/trails.csv" \
            --provenance "$GITHUB_WORKSPACE/trails-provenance.bin" \
            --domains-out "$GITHUB_WORKSPACE/maltrail-malware-domains.txt"
          cd "$GITHUB_WORKSPACE"
          sha256sum trails.csv | cut -d' ' -f1 > trails.csv.sha256
          gzip -9 -n -c trails.csv > trails.csv.gz
          # Where each indicator came from: the report it was extracted from and the file it lives
          # in. The dashboard cites it in the trail drawer; only the server fetches it.
          sha256sum trails-provenance.bin | cut -d' ' -f1 > trails-provenance.bin.sha256
          gzip -9 -n -c trails-provenance.bin > trails-provenance.bin.gz
          echo "[i] aggregate  $(stat -c%s trails.csv) -> $(stat -c%s trails.csv.gz) gzipped"
          echo "[i] provenance $(stat -c%s trails-provenance.bin) -> $(stat -c%s trails-provenance.bin.gz) gzipped"
          # A domain-only view of the malware trails, for the DNS-filtering integrations that
          # consume the list without running Maltrail. Published UNCOMPRESSED and under its
          # historical name: NextDNS, NoTracking, pfBlockerNG, MobSF and MobileAudit each hardcode
          # a URL to a plain text file, and handing them a .gz would break them a second time.
          sha256sum maltrail-malware-domains.txt | cut -d' ' -f1 > maltrail-malware-domains.txt.sha256
          echo "[i] domains    $(wc -l < maltrail-malware-domains.txt) names, $(stat -c%s maltrail-malware-domains.txt) bytes"
          echo "domains=$(wc -l < maltrail-malware-domains.txt)" >> "$GITHUB_OUTPUT"
          echo "sha=$(cat trails.csv.sha256)" >> "$GITHUB_OUTPUT"
          echo "rows=$(wc -l < trails.csv)" >> "$GITHUB_OUTPUT"
          echo "engine=$(git -C "$GITHUB_WORKSPACE/maltrail" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # An empty or tiny aggregate published to every sensor is the worst outcome available: it
      # installs, starts, serves a dashboard and detects nothing. core.assemble already refuses to
      # write nothing; this refuses to publish a set that collapsed for some other reason.
      - name: Refuse to publish a collapsed set
        run: |
          rows=${{ steps.assemble.outputs.rows }}
          if [ "$rows" -lt 1000000 ]; then
            echo "[!] only $rows trails assembled - refusing to publish"
            exit 1
          fi
          echo "[i] $rows trails, sha256 ${{ steps.assemble.outputs.sha }}"
          domains=${{ steps.assemble.outputs.domains }}
          if [ "$domains" -lt 500000 ]; then
            echo "[!] only $domains malware domains derived - refusing to publish"
            exit 1
          fi
          echo "[i] $domains malware domains"

      # Nothing to do when the content has not moved since the last publish. This is what keeps a
      # 4x/day schedule from making 4 releases a day on a quiet weekend.
      - name: Has the content changed since the last publish?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh release download --repo "$GITHUB_REPOSITORY" --pattern trails.csv.sha256 --output - 2>/dev/null || true)
          # Unchanged content is not enough to skip: the newest release also has to actually carry
          # every asset we publish. Otherwise adding one means waiting for the content to move
          # before it first appears, and anything pointing at releases/latest/download for it 404s
          # until then - which is exactly the outage that made us republish the blocklist.
          domains_asset=$(gh release download --repo "$GITHUB_REPOSITORY" --pattern maltrail-malware-domains.txt.sha256 --output - 2>/dev/null || true)
          if [ "$previous" = "${{ steps.assemble.outputs.sha }}" ] && [ -n "$domains_asset" ]; then
            echo "[i] unchanged since the last publish ($previous)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "[i] changed: ${previous:-<no previous release>} -> ${{ steps.assemble.outputs.sha }}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag name
        if: steps.changed.outputs.publish == 'true'
        id: tag
        run: echo "name=content-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.changed.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.tag.outputs.name }}" \
            --notes "Assembled from ${{ github.sha }} by maltrail@${{ steps.assemble.outputs.engine }}.

          ${{ steps.assemble.outputs.rows }} trails, sha256 \`${{ steps.assemble.outputs.sha }}\`.

          Point \`STATIC_TRAILS_URL\` at the rolling URL to track the newest set:

              https://github.com/stamparm/trails/releases/latest/download/trails.csv.gz

          or at this release's asset to pin.

          DNS filtering: ${{ steps.assemble.outputs.domains }} malware domains, names only, at

              https://github.com/stamparm/trails/releases/latest/download/maltrail-malware-domains.txt

          Review and test before enabling blocking - a threat-intelligence list can carry false
          positives and indicators that do not suit every environment." \
            "$GITHUB_WORKSPACE/trails.csv.gz" \
            "$GITHUB_WORKSPACE/trails.csv.sha256" \
            "$GITHUB_WORKSPACE/trails-provenance.bin.gz" \
            "$GITHUB_WORKSPACE/trails-provenance.bin.sha256" \
            "$GITHUB_WORKSPACE/maltrail-malware-domains.txt" \
            "$GITHUB_WORKSPACE/maltrail-malware-domains.txt.sha256"

      # Same keyless mechanism the maltrail release workflow uses, so there is no signing key to
      # hold or rotate. Verify with: gh attestation verify trails.csv.gz --repo stamparm/trails
      - name: Attest
        if: steps.changed.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          # The blocklist is attested too: it is redistributed further than the aggregate is, into
          # resolvers whose operators have no other way to tell our file from a modified copy.
          subject-path: |
            ${{ github.workspace }}/trails.csv.gz
            ${{ github.workspace }}/maltrail-malware-domains.txt

      # Without this the repository accumulates a release per publish forever - 4 a day, ~16 GB a
      # year even gzipped. Keep the last 30 days for rollback, plus the newest publish of each
      # older month as a dated archive, and drop the rest.
      #
      # Verified against 190 days of synthetic tags before it ever ran for real: 760 in, 630
      # deleted, 130 kept - the last 30 days in full plus one archive per older month. This deletes
      # things unattended, so it was not going to find out in production.
      #
      # The newest release is skipped unconditionally, ahead of any date arithmetic.
      # STATIC_TRAILS_URL points at releases/latest/download, so deleting the newest release breaks
      # trail updates for every deployment at once. That must not depend on a date comparison being
      # right.
      - name: Prune old releases
        if: steps.changed.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '30 days ago' +%Y%m%d)
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
                   --jq '.[] | select(.tagName | startswith("content-")) | .tagName' | sort -r)
          newest=$(printf '%s\n' "$tags" | head -1)
          echo "[i] newest release is $newest and is never pruned"
          kept_months=""
          printf '%s\n' "$tags" | tail -n +2 | while read -r tag; do
              [ -n "$tag" ] || continue
              day=${tag#content-}; day=${day%%-*}
              month=${day%??}
              if [ "$day" -ge "$cutoff" ]; then continue; fi
              case " $kept_months " in *" $month "*) ;; *) kept_months="$kept_months $month"; continue ;; esac
              echo "[i] pruning $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
