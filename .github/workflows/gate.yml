# The content gate. Runs on every commit, and it is the half that did not exist before the split.
#
# A trail here becomes a detection on somebody else's network, so the two questions worth asking on
# every push are cheap enough to ask every time: can this entry ever match on the wire, and does it
# match something it must never match. Together about 12 seconds.
#
# It checks out maltrail to get the checker, deliberately. check_trails.py judges an entry by the
# engine's own rules - VALID_DNS_NAME_REGEX, IGNORE_DNS_QUERY_SUFFIXES, the whitelist, the idna
# encoding update_trails() applies - and a copy vendored here would drift from them. One
# implementation, living with the code it has to agree with.

name: Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content:
    name: trail sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the content
        uses: actions/checkout@v5
        with:
          path: trails

      - name: Check out the engine (for the checker and its rules)
        uses: actions/checkout@v5
        with:
          repository: stamparm/maltrail
          path: maltrail

      # Entries that can never match: a non-ASCII key idna refuses, a wire form
      # VALID_DNS_NAME_REGEX rejects, a last label in IGNORE_DNS_QUERY_SUFFIXES. Also reports
      # (without failing) the trails a whitelisted parent domain shadows.
      - name: Trails are reachable on the wire
        working-directory: maltrail
        run: python3 sensor/tools/check_trails.py --path ../trails

      # And the other direction: no trail may match a name that must never be flagged. This is the
      # one that sees REGEX trails - a popularity-list intersection cannot, because a pattern is
      # never equal to a domain.
      - name: No trail matches a canary
        working-directory: maltrail
        run: python3 sensor/tools/check_trails.py --path ../trails --canaries

      # The same question against the 10,000 most popular domains instead of 47 hand-picked ones.
      # A loose pattern is the failure that actually reached a customer - `^[a-z]{2}\-[a-z]{2,3}\.
      # (top|club)$` matched 89 domains in the top 1M, amazon-corp.com among them - and a 47-name
      # list has no chance of containing the one it hits. Clean at the time of writing, ~3s.
      - name: No REGEX trail matches a top-10k domain
        working-directory: maltrail
        run: >
          python3 sensor/tools/check_trails.py --path ../trails --kinds regex
          --canaries tests/canaries-top10k.txt

      # Literals, and only in malware/ and malicious/. suspicious/ is excluded ON PURPOSE: those
      # piles exist to name popular services whose use is itself the signal (ddns.net, ngrok.io,
      # wix.com, ipify.org), so 68 of the 70 literal hits live there and every one is correct.
      # Gating them would be an alarm muted on its first day. This found lnkd.in - LinkedIn's URL
      # shortener, bulk-imported into an ek_clearfake block and blanket-listed as malicious.
      #
      # --allow-trail: 713mtauburnctcolumbusoh43085.st is a real Mirai host that is ALSO ranked, and
      # it is already in misc/alexa1m.py's curated IGNORE for the same reason. Ranked does not mean
      # benign, which is why this half is scoped rather than trusted.
      - name: No literal malware trail is a top-10k domain
        working-directory: maltrail
        run: |
          for pile in malware malicious; do
            python3 sensor/tools/check_trails.py --path "../trails/$pile" --kinds literal \
              --canaries tests/canaries-top10k.txt \
              --allow-trail 713mtauburnctcolumbusoh43085.st
          done

      # The set has to assemble at all. Cheap, and it is the exact code the publish job runs, so a
      # tree that cannot be assembled fails here rather than at publish time.
      - name: The content assembles
        working-directory: maltrail
        run: python3 -m core.assemble --root ../trails --out /tmp/trails.csv
