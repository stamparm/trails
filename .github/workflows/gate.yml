# The content gate. Runs on every commit, and it is the half that did not exist before the split.
#
# A trail here becomes a detection on somebody else's network, so the two questions worth asking on
# every push are cheap enough to ask every time: can this entry ever match on the wire, and does it
# match something it must never match. Together about 12 seconds.
#
# It checks out maltrail to get the checker, deliberately. check_trails.py judges an entry by the
# engine's own rules - VALID_DNS_NAME_REGEX, IGNORE_DNS_QUERY_SUFFIXES, the whitelist, the idna
# encoding update_trails() applies - and a copy vendored here would drift from them. One
# implementation, living with the code it has to agree with.

name: Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content:
    name: trail sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the content
        uses: actions/checkout@v5
        with:
          path: trails

      # One entry per line and nothing around it. Tabs, trailing spaces, blank-line runs and
      # missing final newlines kept arriving (web editors, mostly), invisible in review, and the
      # 2026-11 clean-up touched 373 files. --fix rewrites a file without changing an entry.
      - name: Whitespace is clean
        working-directory: trails
        run: python3 tools/check_whitespace.py

      - name: Check out the engine (for the checker and its rules)
        uses: actions/checkout@v5
        with:
          repository: stamparm/maltrail
          path: maltrail

      # Entries that can never match: a non-ASCII key idna refuses, a wire form
      # VALID_DNS_NAME_REGEX rejects, a last label in IGNORE_DNS_QUERY_SUFFIXES, a malformed address.
      # Also a sinkhole address listed as some family's C2. Reports (without failing) the trails a
      # whitelisted parent domain shadows.
      #
      # --strict: the warnings fail too. Each one is a class removed by hand in 2026-11 (hosts-file
      # pastes, link-local and IPv4-mapped IPv6, a sandbox's search domain glued onto a name, a
      # university's own RMM server in bad_rmmtool) and the pile was at zero when this was turned on.
      - name: Trails are reachable on the wire
        working-directory: maltrail
        run: python3 sensor/tools/check_trails.py --path ../trails --strict

      # And the other direction: no trail may match a name that must never be flagged. This is the
      # one that sees REGEX trails - a popularity-list intersection cannot, because a pattern is
      # never equal to a domain.
      - name: No trail matches a canary
        working-directory: maltrail
        run: python3 sensor/tools/check_trails.py --path ../trails --canaries

      # The same question for trails written WITHOUT a host. "/wp-includes/ID3/" fires on that path of
      # every host - and the sensor also looks a request up by its parent directory and its last
      # segment - so it fired on every WordPress site, as "emotet (malware)". The canaries are
      # WordPress core, common software paths and English words (tests/canaries-paths.txt).
      - name: No host-less path trail matches an ordinary request
        working-directory: maltrail
        run: python3 sensor/tools/check_trails.py --path ../trails --path-canaries

      # The same question against the 100,000 most popular domains instead of 47 hand-picked ones,
      # at TWO depths, because the two halves have opposite noise profiles. tests/canaries-top100k.txt
      # carries the reasoning and the measurements.
      #
      # Regexes get the whole list. Across the full top 1M only three patterns ever match a ranked
      # domain and the first hit is at #89,031, so a pattern reaching this far is too loose - signal,
      # not noise. It caught one the day it landed: `^[a-z]{2}\-[a-z]{2,3}\.(top|club)$` matching
      # qu-in.top, my-ip.club, ru-vpn.top and go-vpn.club.
      - name: No REGEX trail matches a top-100k domain
        working-directory: maltrail
        run: >
          python3 sensor/tools/check_trails.py --path ../trails --kinds regex
          --canaries tests/canaries-top100k.txt

      # Literals get the first 30,000, where depth costs noise directly: a C2 with a big botnet
      # earns its rank honestly. Measured on the gated piles - 10k: 1 hit, 30k: 16, 50k: 32,
      # 100k: 90 - and 30k is the last depth whose findings are a sitting's work.
      #
      # malware/ and malicious/ only. suspicious/ exists TO name popular services whose use is the
      # signal (ddns.net, ngrok.io, wix.com, ipify.org), so nearly every literal hit is there and
      # every one is correct; gating it would be an alarm muted on day one.
      #
      # Correct-but-ranked trails live in tests/canaries-allow.txt WITH a reason - Conficker's 2008
      # C2 is still ranked because infected hosts still beacon at it. Anything NOT in that file
      # fails, which is how lnkd.in, selcdn.ru and totalav.com were found and removed.
      - name: No literal malware trail is a top-30k domain
        working-directory: maltrail
        run: |
          for pile in malware malicious; do
            python3 sensor/tools/check_trails.py --path "../trails/$pile" --kinds literal \
              --canaries tests/canaries-top100k.txt:30000 \
              --allow-file tests/canaries-allow.txt
          done

      # One label below a top-1,000 domain. The literal step above only fires when a trail IS a
      # ranked name, so `ssls.microsoft.com`, `*.mcas.ms` and `email.189.cn` all passed it - most of
      # the 2026-11 clean-up was this shape. Platforms whose subdomains belong to customers
      # (`.b-cdn.net`) are allowed whole in tests/canaries-allow.txt, with the reason.
      - name: No host trail sits under a top-1k domain
        working-directory: maltrail
        run: |
          for pile in malware malicious; do
            python3 sensor/tools/check_trails.py --path "../trails/$pile" \
              --brand-subdomains tests/canaries-top100k.txt:1000 \
              --allow-file tests/canaries-allow.txt
          done

      # A URL trail naming an ordinary file on a top-30k host: `<site>/xmlrpc.php` fires on every
      # WordPress pingback to that site. Neither a domain nor host-less, so no step above sees it;
      # 429 gootkit trails had this shape.
      - name: No URL trail names a stock file on a popular host
        working-directory: maltrail
        run: |
          for pile in malware malicious; do
            python3 sensor/tools/check_trails.py --path "../trails/$pile" \
              --stock-paths tests/canaries-top100k.txt:30000 \
              --allow-file tests/canaries-allow.txt
          done

      # The set has to assemble at all. Cheap, and it is the exact code the publish job runs, so a
      # tree that cannot be assembled fails here rather than at publish time.
      - name: The content assembles
        working-directory: maltrail
        run: python3 -m core.assemble --root ../trails --out /tmp/trails.csv
